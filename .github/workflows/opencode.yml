name: opencode
on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
jobs:
  opencode:
    if: |
      contains(github.event.comment.body, '/oc') ||
      contains(github.event.comment.body, '/opencode')
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: write # Needed to check out the repo and potentially push changes
      pull-requests: write # Needed for interacting with PRs
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 1
      - name: Run OpenCode
        uses: anomalyco/opencode/github@latest
        env:
          OPENROUTER_API_KEY: ${{ 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 }}
        with:
          model: mistralai/devstral-2512:free
